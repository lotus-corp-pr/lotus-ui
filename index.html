<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuper TV - Web Version</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <div class="logo">
                <h1>XUPER TV</h1>
                <p>Android TV Web Edition</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>
                
                <button type="submit" class="btn-login">INICIAR SESIÓN</button>
                
                <div class="error-message" id="login-error"></div>
            </form>
            
            <div class="test-credentials">
                <h3>Usuarios de Prueba:</h3>
                <p>Usuario: demo / Contraseña: demo</p>
                <p>Usuario: user1 / Contraseña: password</p>
                <p>Usuario: admin / Contraseña: admin123</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="screen hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="btn-header" data-tab="home">INICIO</button>
                <button class="btn-header" data-tab="categories">CATEGORÍAS</button>
                <button class="btn-header" data-tab="search">BUSCAR</button>
                <button class="btn-header" data-tab="favorites">FAVORITOS</button>
                <button class="btn-header" data-tab="history">HISTORIAL</button>
            </div>
            
            <div class="header-right">
                <button class="btn-header" id="btn-logout">CERRAR SESIÓN</button>
                <span class="user-info" id="user-info"></span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home Tab -->
            <section id="tab-home" class="tab-content active">
                <h2>Contenido Destacado</h2>
                <div class="content-grid" id="featured-content"></div>
            </section>

            <!-- Categories Tab -->
            <section id="tab-categories" class="tab-content">
                <h2>Categorías</h2>
                <div class="category-list" id="category-list"></div>
            </section>

            <!-- Search Tab -->
            <section id="tab-search" class="tab-content">
                <h2>Buscar</h2>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Buscar películas, series o canales..." class="search-input">
                    <button id="btn-search" class="btn-search">BUSCAR</button>
                </div>
                
                <div class="search-results" id="search-results"></div>
                
                <!-- Google Search Integration -->
                <div class="google-search-container hidden" id="google-search-container">
                    <h3>Resultados de Búsqueda en Google</h3>
                    <iframe id="google-iframe" class="google-iframe" src="about:blank"></iframe>
                    <button id="btn-close-google" class="btn-close">Cerrar Búsqueda en Google</button>
                </div>
            </section>

            <!-- Favorites Tab -->
            <section id="tab-favorites" class="tab-content">
                <h2>Mis Favoritos</h2>
                <div class="content-grid" id="favorites-content"></div>
            </section>

            <!-- History Tab -->
            <section id="tab-history" class="tab-content">
                <h2>Historial</h2>
                <div class="content-grid" id="history-content"></div>
            </section>
        </main>

        <!-- Video Player Modal -->
        <div id="player-modal" class="modal hidden">
            <div class="modal-content">
                <div class="player-header">
                    <h2 id="player-title">Título del Video</h2>
                    <button class="btn-close" id="btn-close-player">&times;</button>
                </div>
                
                <div class="player-container">
                    <video id="video-player" class="video-player" controls>
                        <source src="" type="video/mp4">
                        Tu navegador no soporta el elemento de video.
                    </video>
                </div>
                
                <div class="player-info" id="player-info"></div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="spinner hidden">
            <div class="spinner-content">
                <div class="spinner-circle"></div>
                <p>Cargando...</p>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
